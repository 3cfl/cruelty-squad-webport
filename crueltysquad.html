<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruelty Squad</title>
<style>
body { margin: 0; background: #000; color: #adffad; font: 16px system-ui; }
canvas { display: block; width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); margin: 0 auto; outline: none; }
#status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
#status[hidden] { display: none; }
</style>
<canvas id="game" width="960" height="540" tabindex="0"></canvas>
<div id="status" role="status">Loading Cruelty Squad…</div>
<script>
(async () => {
    const status = document.getElementById("status");
    const manifest = await get("https://cdn.jsdelivr.net/gh/3cfl/cruelty-squad-webport@bea7d507332d22477e718cee6ba4260804dda22d/manifest.json").then(response => response.json());
    const executable = manifest.engine + "index";
    await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = executable + ".js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Could not load the game engine."));
        document.head.append(script);
    });
    if (!Engine.isWebGLAvailable(2)) throw new Error("This game requires WebGL 2.");
    const engine = new Engine({
        canvas: document.getElementById("game"),
        canvasResizePolicy: 0,
        focusCanvas: true,
        executable
    });
    const pack = new Uint8Array(manifest.size);
    let next = 0;
    let loaded = 0;
    const workers = Array.from({length: 4}, async () => {
        while (next < manifest.parts.length) {
            const part = manifest.parts[next++];
            const response = await get(part.url);
            const stream = response.body.pipeThrough(new DecompressionStream("gzip"));
            const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
            if (bytes.length !== part.size) throw new Error("A game file was incomplete.");
            pack.set(bytes, part.offset);
            loaded += bytes.length;
            status.textContent = "Loading Cruelty Squad… " + Math.floor(100 * loaded / pack.length) + "%";
        }
    });
    await Promise.all(workers);
    status.textContent = "Starting Cruelty Squad…";
    await engine.init(executable);
    await engine.preloadFile(pack, "index.pck");
    await engine.start({args: ["--main-pack", "index.pck"]});
    status.hidden = true;

    async function get(url) {
        for (let attempt = 0; attempt < 3; attempt++) {
            try {
                const response = await fetch(url);
                if (response.ok) return response;
            } catch (error) {
                if (attempt === 2) throw error;
            }
        }
        throw new Error("Could not download " + url.split("/").pop() + ".");
    }
})().catch(error => {
    document.getElementById("status").textContent = error.message + " Reload to try again.";
});
</script>
</html>
